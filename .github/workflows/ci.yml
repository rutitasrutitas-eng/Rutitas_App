name: Rutitas Android - CI (SDD, seguridad, lint, tests y emulador)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: rutitas-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-security:
    name: Documentos, configuración y escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validar la configuración YAML y documentos SDD
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f, aliases: true) }; puts "Workflows YAML válidos"'
          for path in README.md AGENTS.md memoria.md .specify/memory/constitution.md \
                      specs/000-arquitectura-base/spec.md specs/000-arquitectura-base/plan.md \
                      specs/000-arquitectura-base/task.md android/gradlew \
                      android/gradle/wrapper/gradle-wrapper.jar android/settings.gradle.kts; do
            test -s "$path" || { echo "::error::Falta $path"; exit 1; }
          done
          python3 scripts/verify_project.py
      - name: Revisar secretos en el historial
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git --redact --exit-code 1 /repo

  build-and-unit:
    name: Kotlin / Android - lint, unit tests, APK y androidTest APK
    needs: docs-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: SDK Android 36, lint, JUnit y compilación
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36'
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Evidencias incluso si alguna prueba falla
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rutitas-ci-android
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  emulator-smoke:
    name: Emulador Android - prueba real de inicio
    needs: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Habilitar KVM en runner Linux
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: cd android && chmod +x ./gradlew && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Informes instrumentados
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rutitas-emulator-results
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14

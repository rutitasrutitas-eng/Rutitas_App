name: Rutitas Android - cargar a Google Play (pruebas internas, manual)

on:
  workflow_dispatch:
    inputs:
      confirm_internal_testing:
        description: 'Escribe SUBIR_A_PRUEBAS_INTERNAS (no producción)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  internal-track:
    if: github.ref == 'refs/heads/main' && inputs.confirm_internal_testing == 'SUBIR_A_PRUEBAS_INTERNAS'
    runs-on: ubuntu-latest
    environment: android-play-internal
    timeout-minutes: 55
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Bloquear publicación de versiones DEMO
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'buildConfigField\("boolean", "DEMO_MODE", "true"\)' app/build.gradle.kts; then
            echo "::error::Publicación bloqueada: Rutitas todavía utiliza DEMO_MODE=true."
            exit 1
          fi
          if grep -Fq 'https://example.invalid/api/' app/build.gradle.kts; then
            echo "::error::Publicación bloqueada: falta configurar y validar el backend real."
            exit 1
          fi
      - name: Validar credenciales
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          for name in UPLOAD_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            test -n "${!name}" || { echo "::error::Falta secret $name"; exit 1; }
          done
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rutitas-upload.jks"
          chmod 600 "$RUNNER_TEMP/rutitas-upload.jks"
      - name: Lint, tests, AAB firmado
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/rutitas-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36'
          chmod +x ./gradlew
          ./gradlew --no-daemon lintRelease testDebugUnitTest bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Subir SOLO como borrador a pruebas internas
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: mx.edu.uttt.rutitas
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: draft
      - name: Limpiar llave temporal
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rutitas-upload.jks"
